name: "Seal Existing Secrets"

on:
  schedule:
    - cron: '*/5 * * * *' # Se ejecuta en el minuto 0 de cada dia (UTC)
  workflow_dispatch: # Se ejecuta manualmente
    inputs:
      repo:
        description: 'Repositorio (org/repo)'
        required: true
        default: 'cabunga/argocd'
      environment:
        description: 'Environment (dejar vacío para secrets del repo)'
        required: false
        default: 'dev'
      branch:
        description: 'Branch'
        required: false
        default: 'main'  
jobs:
  seal-existing:
    runs-on: ubuntu-latest
    permissions:
      contents:  write
    env:
      ENVIRONMENT: dev  # Permiso necesario para leer secrets
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Instalar Kubeseal        
        run: |
          KUBESEAL_VERSION=$(curl -s https://api.github.com/repos/bitnami-labs/sealed-secrets/releases/latest | grep tag_name | cut -d '"' -f 4 | sed 's/v//')
          wget "https://github.com/bitnami-labs/sealed-secrets/releases/download/v${KUBESEAL_VERSION}/kubeseal-${KUBESEAL_VERSION}-linux-amd64.tar.gz"
          tar -xvzf kubeseal-${KUBESEAL_VERSION}-linux-amd64.tar.gz kubeseal
          sudo install -m 0755 kubeseal /usr/local/bin/kubeseal
      - name: Listar secrets usando GitHub API
        if: false
        env:
          GH_TOKEN: ${{ secrets.MY_PERSONAL_ACCESS_TOKEN }}   # Recomendado usar PAT con permisos
          REPO: ${{ inputs.repo }}
          ENV: ${{ inputs.environment }}
        run: |
          echo "📍 Repositorio : $REPO"
          if [ -n "$ENV" ]; then
            URL="https://api.github.com/repos/$REPO/environments/$ENV/secrets"
            echo "🌍 Environment : $ENV"
          else
            URL="https://api.github.com/repos/$REPO/actions/secrets"
            echo "📦 Repository Secrets"
          fi

          curl -L -s \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$URL" | jq '.' > secrets-list.json

          echo "✅ Lista de secrets guardada (solo nombres)"
      - name: Verificar si hay secretos actualizados
        id: check-update1
        if: false
        env:
          GH_TOKEN: ${{ secrets.MY_PERSONAL_ACCESS_TOKEN }}
          REPO: ${{ inputs.repo }}
          ENV: ${{ inputs.environment }}
        run: |
          echo "📍 Repositorio : $REPO"
          
          if [ -n "$ENV" ]; then
            URL="https://api.github.com/repos/$REPO/environments/$ENV/secrets"
          else
            URL="https://api.github.com/repos/$REPO/actions/secrets"
          fi

          curl -L -s \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$URL" > secrets-list.json

          # Verificar si TODOS los secrets tienen created_at == updated_at
          UPDATED_COUNT=$(jq -r '.secrets[] | select(.created_at != .updated_at) | .name' secrets-list.json | wc -l)

          echo "Secrets con cambios (updated_at != created_at): $UPDATED_COUNT"

          if [ "$UPDATED_COUNT" -eq 0 ]; then
            echo "✅ Todos los secrets tienen la misma fecha de creación y actualización."
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "No es necesario regenerar el sealed-secret."
          else
            echo "🔄 Hay $UPDATED_COUNT secreto(s) actualizado(s)."
            echo "changed=true" >> $GITHUB_OUTPUT
          fi    
      - name: Verificar si hay cambios reales en los secrets
        id: check-update
        env:
          GH_TOKEN: ${{ secrets.MY_PERSONAL_ACCESS_TOKEN }}
          REPO: ${{ inputs.repo }}
          ENV: ${{ inputs.environment }}
        run: |
          echo "📍 Repositorio : $REPO"
          echo "🌍 Environment: $ENV"

          if [ -n "$ENV" ]; then
            URL="https://api.github.com/repos/$REPO/environments/$ENV/secrets"
          else
            URL="https://api.github.com/repos/$REPO/actions/secrets"
          fi

          curl -L -s \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$URL" > secrets-list.json

          # Guardamos hash del estado actual para comparación
          CURRENT_HASH=$(jq -r '.secrets[] | [.name, .updated_at, .created_at] | @tsv' secrets-list.json | sort | sha256sum | cut -d' ' -f1)

          echo "Hash actual de secrets: $CURRENT_HASH"

          if [ -f last-secrets-hash.txt ]; then
            PREVIOUS_HASH=$(cat last-secrets-hash.txt)
            echo "Hash anterior: $PREVIOUS_HASH"

            if [ "$CURRENT_HASH" = "$PREVIOUS_HASH" ]; then
              echo "✅ No se detectaron cambios en los secrets."
              echo "changed=false" >> $GITHUB_OUTPUT
            else
              echo "🔄 Se detectaron cambios en los secrets."
              echo "changed=true" >> $GITHUB_OUTPUT
            fi
          else
            echo "⚡ Primera ejecución - Creando referencia."
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

          # Guardar hash actual (se usará en el siguiente paso)
          echo "$CURRENT_HASH" > last-secrets-hash.txt          
      - name: Rebuild certificate from GitHub secret
        run: |
          if [ "${ENVIRONMENT}" = "dev" ]; then
            echo "${{ secrets.SEALED_SECRET_CERT_DEV }}" > dev-cert.pem
            echo "CERT_FILE=dev-cert.pem" >> $GITHUB_ENV

          elif [ "${ENVIRONMENT}" = "uat" ]; then
            echo "${{ secrets.SEALED_SECRET_CERT_UAT }}" > uat-cert.pem
            echo "CERT_FILE=uat-cert.pem" >> $GITHUB_ENV

          elif [ "${ENVIRONMENT}" = "prd" ]; then
            echo "${{ secrets.SEALED_SECRET_CERT_PRD }}" > prd-cert.pem
            echo "CERT_FILE=prd-cert.pem" >> $GITHUB_ENV

          else
            echo "Ambiente no válido"
            exit 1
          fi
      - name: Crear secrets.yaml con valores reales
        if: steps.check-update.outputs.changed == 'true'
        env:
          ALL_SECRETS: ${{ toJSON(secrets) }}
        run: |
          python3 << 'EOF'
          import json
          import os

          secrets = json.loads(os.environ.get("ALL_SECRETS", "{}"))

          # Lista de secretos a excluir
          exclude = {
              "MY_PERSONAL_ACCESS_TOKEN", "GITHUB_TOKEN", "github_token","DOCKER_PASSWORD",
              "GH_TOKEN", "TOKEN", "PAT", "PASSWORD","SEALED_SECRET_CERT","SEALED_SECRET_CERT_DEV","SEALED_SECRET_CERT_UAT","SEALED_SECRET_CERT_PRD"
          }

          with open("secrets.yaml", "w") as f:
              f.write("apiVersion: v1\n")
              f.write("kind: Secret\n")
              f.write("metadata:\n")
              f.write("  name: sealed-secrets\n")
              f.write("  namespace: argocd\n")        # ← Aseguramos el namespace
              f.write("type: Opaque\n")
              f.write("stringData:\n")

              count = 0
              for name, value in sorted(secrets.items()):
                  if value and name.upper() not in [e.upper() for e in exclude] and not name.upper().endswith(("_TOKEN", "_PAT")):
                      escaped = value.replace('\\', '\\\\').replace('"', '\\"').replace('\n', '\\n')
                      f.write(f'  {name}: "{escaped}"\n')
                      count += 1
                      print(f"✓ Agregado: {name}")
                  elif value:
                      print(f"⏭️  Excluido: {name}")

              print(f"\n✅ Archivo secrets.yaml creado con {count} secrets.")
          EOF
          cat secrets.yaml
      - name: Sellado con Kubeseal
        if: steps.check-update.outputs.changed == 'true'
        run: |
          kubeseal --format yaml  --cert ${CERT_FILE} < secrets.yaml > sealed-secrets-new.yaml
          echo "✅ Archivo sellado creado: sealed-secrets-new.yaml"
          cat sealed-secrets-new.yaml | head -n 30

      - name: Detectar cambios reales
        if: steps.check-update.outputs.changed == 'true'
        id: changes
        run: |
          echo "Comparando secrets actuales con los nuevos..."

          if [ ! -f sealed-secrets.yaml ]; then
            echo "Primera ejecución → creando archivo"
            mv sealed-secrets-new.yaml sealed-secrets.yaml
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            # Comparación más inteligente: comparamos el contenido original (no el sealed)
            if diff -q secrets.yaml secrets-new.yaml > /dev/null 2>&1; then
              echo "No hay cambios en los valores de los secretos"
              echo "changed=false" >> $GITHUB_OUTPUT
              rm -f secrets-new.yaml sealed-secrets-new.yaml
            else
              echo "Se detectó cambio en uno o más secretos → actualizando"
              mv sealed-secrets-new.yaml sealed-secrets.yaml
              #mv secrets-new.yaml secrets.yaml
              echo "changed=true" >> $GITHUB_OUTPUT
            fi
          fi

      - name: Commit y Push (solo si hay cambios)
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add sealed-secrets.yaml last-secrets-hash.txt
          git commit -m "chore: update sealed-secrets.yaml from GitHub secrets"
          git push --force-with-lease origin HEAD:${{ inputs.branch }}
          
          echo "🚀 sealed-secrets.yaml actualizado y subido a la branch ${{ inputs.branch }}"       

