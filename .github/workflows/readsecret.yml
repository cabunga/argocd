name: "Seal Existing Secrets"

on:
  workflow_dispatch: # Se ejecuta manualmente
    inputs:
      repo:
        description: 'Repositorio (org/repo)'
        required: true
        default: 'cabunga/argocd'
      environment:
        description: 'Environment (dejar vacío para secrets del repo)'
        required: false
        #default: 'dev'
jobs:
  seal-existing:
    runs-on: ubuntu-latest
    permissions:
      contents:  write      # Permiso necesario para leer secrets
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar Kubeseal
        if: false
        run: |
          KUBESEAL_VERSION=$(curl -s https://api.github.com/repos/bitnami-labs/sealed-secrets/releases/latest | grep tag_name | cut -d '"' -f 4 | sed 's/v//')
          wget "https://github.com/bitnami-labs/sealed-secrets/releases/download/v${KUBESEAL_VERSION}/kubeseal-${KUBESEAL_VERSION}-linux-amd64.tar.gz"
          tar -xvzf kubeseal-${KUBESEAL_VERSION}-linux-amd64.tar.gz kubeseal
          sudo install -m 0755 kubeseal /usr/local/bin/kubeseal
      - name: Listar secrets usando GitHub API
        env:
          GH_TOKEN: ${{ secrets.MY_PERSONAL_ACCESS_TOKEN }}   # Recomendado usar PAT con permisos
          REPO: ${{ inputs.repo }}
          ENV: ${{ inputs.environment }}
        run: |
          echo "📍 Repositorio : $REPO"
          if [ -n "$ENV" ]; then
            URL="https://api.github.com/repos/$REPO/environments/$ENV/secrets"
            echo "🌍 Environment : $ENV"
          else
            URL="https://api.github.com/repos/$REPO/actions/secrets"
            echo "📦 Repository Secrets"
          fi

          curl -L -s \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$URL" | jq '.' > secrets-list.json

          echo "✅ Lista de secrets guardada (solo nombres)"

      - name: Crear secrets.yaml con valores reales
        env:
          ALL_SECRETS: ${{ toJSON(secrets) }}
        run: |
          python3 << 'EOF'
          import json
          import os

          secrets = json.loads(os.environ.get("ALL_SECRETS", "{}"))

          # Lista de secretos a excluir
          exclude = {
              "MY_PERSONAL_ACCESS_TOKEN", "GITHUB_TOKEN", "github_token",
              "GH_TOKEN", "TOKEN", "PAT", "PASSWORD"
          }

          with open("secrets.yaml", "w") as f:
              f.write("apiVersion: v1\n")
              f.write("kind: Secret\n")
              f.write("metadata:\n")
              f.write("  name: sealed-secrets\n")
              f.write("type: Opaque\n")
              f.write("stringData:\n")

              count = 0
              for name, value in sorted(secrets.items()):
                  if value and name.upper() not in [e.upper() for e in exclude] and not name.upper().endswith(("_TOKEN", "_PAT")):
                      escaped = value.replace('\\', '\\\\').replace('"', '\\"').replace('\n', '\\n')
                      f.write(f'  {name}: "{escaped}"\n')
                      count += 1
                      print(f"✓ Agregado: {name}")
                  elif value:
                      print(f"⏭️  Excluido: {name}")

              print(f"\n✅ Archivo secrets.yaml creado con {count} secrets.")
          EOF
          cat secrets.yaml
      - name: Commit y Push secrets.yaml
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if [[ -f secrets.yaml ]]; then
            git add secrets.yaml
            
            if git diff --staged --quiet; then
              echo "No hay cambios para commitear."
            else
              git commit -m "chore: update secrets.yaml from GitHub secrets"
              
              # Push corregido
              if [ -n "${{ inputs.branch }}" ]; then
                git push origin HEAD:${{ inputs.branch }}
              else
                git push origin HEAD
              fi
              
              echo "✅ secrets.yaml subido correctamente"
            fi
          else
            echo "❌ No se generó secrets.yaml"
            exit 1
          fi
      - name: Subir resultados
        uses: actions/upload-artifact@v4
        with:
          name: all-sealed-secrets
          path: sealed-secrets-output/
