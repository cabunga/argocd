name: "Seal Existing Secrets"

on:
  workflow_dispatch: # Se ejecuta manualmente
    inputs:
      repo:
        description: 'Repositorio (org/repo)'
        required: true
        default: 'cabunga/argocd'
      environment:
        description: 'Environment (dejar vacío para secrets del repo)'
        required: false
        #default: 'dev'
jobs:
  seal-existing:
    runs-on: ubuntu-latest
    permissions:
      contents:  read      # Permiso necesario para leer secrets
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar Kubeseal
        if: false
        run: |
          KUBESEAL_VERSION=$(curl -s https://api.github.com/repos/bitnami-labs/sealed-secrets/releases/latest | grep tag_name | cut -d '"' -f 4 | sed 's/v//')
          wget "https://github.com/bitnami-labs/sealed-secrets/releases/download/v${KUBESEAL_VERSION}/kubeseal-${KUBESEAL_VERSION}-linux-amd64.tar.gz"
          tar -xvzf kubeseal-${KUBESEAL_VERSION}-linux-amd64.tar.gz kubeseal
          sudo install -m 0755 kubeseal /usr/local/bin/kubeseal
      - name: Listar secrets usando GitHub API (curl)
        env:
          GH_TOKEN: ${{ secrets.MY_PERSONAL_ACCESS_TOKEN }}
          REPO: ${{ inputs.repo }}
          ENV: ${{ inputs.environment }}
        run: |
          echo "📍 Repositorio  : $REPO"
          echo "🌍 Environment : $ENV"
          echo "──────────────────────────────────────────────"

          if [ -n "$ENV" ]; then
            URL="https://api.github.com/repos/$REPO/environments/$ENV/secrets"
            echo "🔗 Consultando Environment Secrets..."
          else
            URL="https://api.github.com/repos/$REPO/actions/secrets"
            echo "🔗 Consultando Repository Secrets..."
          fi

          response=$(curl -L -s \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$URL")

          echo "$response" | jq '.' || echo "$response"

      - name: Mostrar TODOS los secrets con sus valores
        env:
          ALL_SECRETS: ${{ toJSON(secrets) }}
        run: |
          echo ""
          echo "══════════════════════════════════════════════"
          echo "📦 TODOS LOS SECRETS Y SUS VALORES"
          echo "══════════════════════════════════════════════"
          echo "$ALL_SECRETS" | jq -r 'to_entries[] | "\(.key): \(.value)"'
          echo "══════════════════════════════════════════════"
          echo "✅ Listado completado"
      - name: Procesar Secretos
        env:
          # IMPORTANTE: Necesitas un PAT con permiso 'secrets:read' 
          # El GITHUB_TOKEN estándar NO puede leer valores de secretos.
            
          GH_TOKEN: ${{ secrets.MY_PERSONAL_ACCESS_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          # 1. Obtener lista de nombres
          SECRETS=$(gh secret list -R "$REPO" --json name -q '.[].name')
          
          mkdir -p sealed-secrets-output

          for NAME in $SECRETS; do
            # Saltamos el propio token para no entrar en un bucle infinito de sellado
            if [ "$NAME" == "MY_PERSONAL_ACCESS_TOKEN" ]; then continue; fi
            
            echo "Procesando: $NAME"
            
            # 2. Extraer el valor (Requiere el PAT)
            gh secret view
            VALUE=$(gh secret view "$NAME"  -R "$REPO")
            
            # 3. Crear Secret temporal y Sellar
            # Usamos el certificado público (asumiendo que está en el repo)
            echo -n "$VALUE" | kubectl create secret generic "$NAME" \
              --from-file=value=/dev/stdin \
              --dry-run=client -o json | \
              kubeseal --cert pub-sealed-secrets.pem --format yaml > "sealed-secrets-output/sealed-$NAME.yaml"
          done

      - name: Subir resultados
        uses: actions/upload-artifact@v4
        with:
          name: all-sealed-secrets
          path: sealed-secrets-output/
